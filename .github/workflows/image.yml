name: Image

# Builds the container image on every change; pushes ghcr.io/kolapsis/jmap-mcp:main and :sha-<commit>
# from the main branch. Versioned tags (X.Y.Z, X.Y, X, latest) come from the release workflow.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/kolapsis/jmap-mcp
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=jmap-mcp
            org.opencontainers.image.description=MCP server giving AI assistants OAuth access to JMAP mailboxes
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.source
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
